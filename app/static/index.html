<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chat</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2de;
    --accent: #2f5d50; --accent-text: #ffffff; --user: #e9efe9; --ok: #2f7d4f; --warn: #b5651d; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9a9993; --line: #33322f;
      --accent: #7fb8a4; --accent-text: #10201b; --user: #24302b; --ok: #6cc28d; --warn: #e3a35c; --bad: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 160px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  label.toggle { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  .empty button { margin: 4px; }
  .msg { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 8px 12px; border-radius: 12px 12px 2px 12px; max-width: 85%; }
  .msg.bot { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; border-radius: 12px; }
  .msg.bot.pending .answer::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  .msg sup { color: var(--accent); font-weight: 600; font-size: 11px; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: normal; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .tag.exact, .tag.semantic { color: var(--ok); border-color: var(--ok); }
  details { margin-top: 6px; font-size: 13px; white-space: normal; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .src { border-left: 2px solid var(--line); padding: 4px 0 4px 10px; margin-top: 6px; }
  .src b { font-weight: 600; }
  .src .pv { color: var(--muted); white-space: pre-wrap; }
  .error { color: var(--bad); }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel);
  }
  form .inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-width: 0; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: var(--accent-text); border-color: var(--accent); padding: 9px 16px; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>RAG Chat</h1>
  <span class="status" id="status"><span class="dot"></span>連線中…</span>
  <div class="tools">
    <label class="toggle"><input type="checkbox" id="useCache" checked>快取</label>
    <button id="upload" type="button">上傳文件</button>
    <input type="file" id="file" multiple accept=".pdf,.md,.txt,.csv" hidden>
    <button id="clearCache" type="button">清快取</button>
  </div>
</header>

<main id="scroll">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p>針對知識庫提問，回答會附上引用來源。</p>
      <button type="button" data-q="試用期可以遠端工作嗎？">試用期可以遠端工作嗎？</button>
      <button type="button" data-q="報帳超過 3000 元要誰簽核？">報帳超過 3000 元要誰簽核？</button>
      <button type="button" data-q="有含 pgvector 的資料庫方案嗎？">有含 pgvector 的資料庫方案嗎？</button>
    </div>
  </div>
</main>

<form id="form">
  <div class="inner">
    <textarea id="input" rows="1" placeholder="輸入問題（Shift+Enter 換行）" maxlength="2000"></textarea>
    <button id="send" type="submit">送出</button>
  </div>
</form>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const thread = $("thread"), scroller = $("scroll"), input = $("input"), send = $("send");
let controller = null;

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2500);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderAnswer(text) {
  return escapeHtml(text).replace(/\[(\d+)\]/g, "<sup>[$1]</sup>");
}

async function refreshStatus() {
  const el = $("status");
  try {
    const h = await (await fetch("/health")).json();
    el.innerHTML = `<span class="dot ok"></span>${escapeHtml(`${h.llm} · ${h.embed} · ${h.chunks} chunks`)}`;
  } catch {
    el.innerHTML = `<span class="dot bad"></span>後端未連線`;
  }
}

function addMessage(role, text) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  if (role === "user") div.textContent = text;
  else div.innerHTML = `<div class="answer"></div><div class="meta"></div>`;
  thread.appendChild(div);
  scroller.scrollTop = scroller.scrollHeight;
  return div;
}

function renderSources(box, sources) {
  if (!sources.length) return;
  const items = sources.map((s, i) => `
    <div class="src"><b>[${i + 1}] ${escapeHtml(s.source)}#${s.chunk_index}</b> · score ${s.score}
    ${s.preview ? `<div class="pv">${escapeHtml(s.preview)}</div>` : ""}</div>`).join("");
  const d = document.createElement("details");
  d.innerHTML = `<summary>${sources.length} 筆引用來源</summary>${items}`;
  box.appendChild(d);
}

function setBusy(busy) {
  send.textContent = busy ? "停止" : "送出";
  input.disabled = busy;
}

async function ask(question) {
  addMessage("user", question);
  const bot = addMessage("bot");
  bot.classList.add("pending");
  const answerEl = bot.querySelector(".answer"), meta = bot.querySelector(".meta");
  let answer = "", sources = [];

  controller = new AbortController();
  setBusy(true);
  try {
    const res = await fetch("/ask/stream", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question, use_cache: $("useCache").checked }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        let event = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7);
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        const payload = JSON.parse(data);
        if (event === "sources") sources = payload;
        else if (event === "done") {
          meta.innerHTML = `<span class="tag ${payload.cache}">${payload.cache === "miss" ? "未命中快取" : `快取命中：${payload.cache}`}</span><span>${payload.ms} ms</span>`;
        } else {
          answer += payload;
          answerEl.innerHTML = renderAnswer(answer);
          scroller.scrollTop = scroller.scrollHeight;
        }
      }
    }
    renderSources(bot, sources);
  } catch (err) {
    if (err.name === "AbortError") meta.innerHTML = `<span class="tag">已停止</span>`;
    else answerEl.innerHTML += `<div class="error">請求失敗：${escapeHtml(err.message)}</div>`;
  } finally {
    bot.classList.remove("pending");
    controller = null;
    setBusy(false);
    input.focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (controller) return controller.abort();
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  input.style.height = "auto";
  ask(q);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight}px`;
});

thread.addEventListener("click", (e) => {
  const q = e.target.dataset?.q;
  if (q && !controller) ask(q);
});

$("upload").addEventListener("click", () => $("file").click());

$("file").addEventListener("change", async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;
  const form = new FormData();
  files.forEach((f) => form.append("files", f));
  toast(`上傳中：${files.length} 個檔案…`);
  try {
    const res = await fetch("/ingest", { method: "POST", body: form });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    toast(body.map((r) => `${r.source}：${r.status}${r.chunks ? `（${r.chunks} chunks）` : ""}`).join("、"));
    refreshStatus();
  } catch (err) {
    toast(`上傳失敗：${err.message}`);
  }
  e.target.value = "";
});

$("clearCache").addEventListener("click", async () => {
  const r = await (await fetch("/cache", { method: "DELETE" })).json();
  toast(`已清除 ${r.cleared_exact_keys} 筆快取`);
});

refreshStatus();
input.focus();
</script>
</body>
</html>
